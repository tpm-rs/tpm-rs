[package]
name = "tpm2-rustcrypto"
description = "Implementation of the tpm2 cryptography traits using the RustCrypto crates"

# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
aes = { version = "0.9", default-features = false }
cbc = { version = "0.2", default-features = false }
cfb-mode = { version = "0.9", default-features = false }
cipher = { version = "0.5", default-features = false }
ctr = { version = "0.10", default-features = false }
ctutils = { version = "0.4", default-features = false }
hmac = { version = "0.13", default-features = false }
ofb = { version = "0.7", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
