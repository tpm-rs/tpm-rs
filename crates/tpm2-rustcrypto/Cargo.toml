[package]
name = "tpm2-rustcrypto"
description = "Implementation of the tpm2 cryptography traits using the RustCrypto crates"

# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
aes = { workspace = true }
camellia = { workspace = true }
cipher = { workspace = true }
cmac = { workspace = true }
ecdsa = { workspace = true, features = ["arithmetic", "hazmat"] }
elliptic-curve = { workspace = true, features = ["arithmetic", "sec1"] }
getrandom = { workspace = true }
hmac = { workspace = true }
p256 = { workspace = true, features = ["arithmetic"] }
p384 = { workspace = true, features = ["arithmetic"] }
p521 = { workspace = true, features = ["arithmetic"] }
rand_chacha = { workspace = true }
rsa = { workspace = true, features = ["hazmat", "u64_digit"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
sm2 = { workspace = true, features = ["arithmetic"] }
sm3 = { workspace = true }
sm4 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
