[package]
name = "tpm2-client"
# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["connection-tcp"]

# Enable the TCP TPM connection (e.g. for the TPM simulator)
connection-tcp = ["dep:zerocopy"]

[dependencies]
tpm2 = { workspace = true }
zerocopy = { version = "0.8", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = { version = "3.27", default-features = false }

[[test]]
name = "simulator"
path = "tests/simulator.rs"
required-features = ["connection-tcp"]
