[package]
name = "tpm2-client"
publish = false
# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["connection-tcp", "rustcrypto"]

# Enable the TCP TPM connection (e.g. for the TPM simulator)
connection-tcp = ["dep:zerocopy"]

# Use RustCrypto as the default cryptography backend (`Backend`). Sessions are
# generic over the backend, so another can be used without this feature.
rustcrypto = ["dep:tpm2-rustcrypto"]

[dependencies]
tpm2 = { workspace = true }
zerocopy = { version = "0.8", features = ["derive"], optional = true }
tpm2-rustcrypto = { path = "../tpm2-rustcrypto", optional = true }
tempfile = { version = "3.27", default-features = false }

[dev-dependencies]
tempfile = { version = "3.27", default-features = false }

[[bin]]
name = "tpm2-client"
path = "src/main.rs"
required-features = ["connection-tcp", "rustcrypto"]

[[test]]
name = "simulator"
path = "tests/simulator.rs"
required-features = ["connection-tcp"]
