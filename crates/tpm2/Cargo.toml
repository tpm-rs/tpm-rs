[package]
name = "tpm2"
description = "Core types and traits for communicating with a TPM 2.0"

# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# We enable all algorithms by default.
#
# The types of this crate accept exactly the values of the enabled features (an
# algorithm that is not enabled is rejected when unmarshaled with its TPM error,
# e.g. `TPM_RC_HASH` for a `TPMI_ALG_HASH`), and they size the profile-dependent
# buffers and lists (`TPM2B_PUBLIC_KEY_RSA`, `TPM2B_PRIVATE`, `TPM2B_TEMPLATE`,
# `HASH_COUNT`, ...). The `tpm-rs` TPM (`tpm2-engine`) depends on this crate
# without default features, enabling exactly the algorithms it implements (see
# the `tpm2` dependency of the workspace `Cargo.toml`). Cargo unifies the
# features of a build, so enabling more features (e.g. for a client that talks
# to other TPMs) also widens the TPM built with it.
default = [
    # Hash Algorithms
    "sha1", "sha256", "sha384", "sha512", "sm3_256", "sha3_256", "sha3_384", "sha3_512",
    # Symmetric Encryption Algorithms
    "aes128", "aes192", "aes256", "sm4_128", "camellia128", "camellia192", "camellia256",
    # Symmetric Encryption Modes
    "ctr", "ofb", "cbc", "ecb",
    # Base Algorithm Families
    "cmac", "rsa", "ecc", "mldsa", "mlkem",
    # RSA Key Sizes
    "rsa1024", "rsa2048", "rsa3072", "rsa4096",
    # RSA Schemes
    "rsassa", "rsapss", "rsaes",
    # ECC Curves
    "nist_p192", "nist_p224", "nist_p256", "nist_p384", "nist_p521", "bn_p256", "bn_p638",
    "sm2_p256", "bp_p256_r1", "bp_p384_r1", "bp_p512_r1", "curve25519", "curve448",
    # ECC Schemes
    "ecdsa", "ecdaa", "ecschnorr", "eddsa", "hash_eddsa", "sm2", "ecmqv",
    # ML-DSA Parameter Sets and Schemes
    "mldsa_44", "mldsa_65", "mldsa_87", "hash_mldsa",
    # ML-KEM Parameter Sets
    "mlkem_512", "mlkem_768", "mlkem_1024",
    # Key Derivation Functions
    "hkdf",
]

# Hash Algorithms
sha1 = []
sha256 = []
sha384 = []
sha512 = []
sm3_256 = []
sha3_256 = []
sha3_384 = []
sha3_512 = []

# Symmetric Encryption Algorithms
aes128 = []
aes192 = []
aes256 = []
sm4_128 = []
camellia128 = []
camellia192 = []
camellia256 = []

# Symmetric Encryption Modes
#
# CFB is always enabled, as the parameter encryption mode.
ctr = []
ofb = []
cbc = []
ecb = []

# Base Algorithm Families
cmac = []
rsa = [] # Enables OAEP, requires at least one RSA Key Size
ecc = [] # Enables ECDH, requires at least one ECC Curve
mldsa = [] # Requires at least one ML-DSA Parameter Set
mlkem = [] # Requires at least one ML-KEM Parameter Set

# RSA Key Sizes
rsa1024 = ["rsa"]
rsa2048 = ["rsa"]
rsa3072 = ["rsa"]
rsa4096 = ["rsa"]

# RSA Schemes
#
# OAEP is always enabled with `rsa`, as the RSA secret sharing scheme.
rsassa = ["rsa"]
rsapss = ["rsa"]
rsaes = ["rsa"]

# ECC Curves
nist_p192 = ["ecc"]
nist_p224 = ["ecc"]
nist_p256 = ["ecc"]
nist_p384 = ["ecc"]
nist_p521 = ["ecc"]
bn_p256 = ["ecc"]
bn_p638 = ["ecc"]
sm2_p256 = ["ecc"]
bp_p256_r1 = ["ecc"]
bp_p384_r1 = ["ecc"]
bp_p512_r1 = ["ecc"]
curve25519 = ["ecc"]
curve448 = ["ecc"]

# ECC Schemes
#
# ECDH is always enabled with `ecc`, as the ECC secret sharing scheme.
ecdsa = ["ecc"]
ecdaa = ["ecc"]
ecschnorr = ["ecc"]
eddsa = ["ecc"] # Requires Curve25519 or Curve448
hash_eddsa = ["eddsa"] # Pre-hash EdDSA requires the pure variant.
sm2 = ["ecc"] # SM2 signing and key exchange
ecmqv = ["ecc"]

# ML-DSA Parameter Sets and Schemes
mldsa_44 = ["mldsa"]
mldsa_65 = ["mldsa"]
mldsa_87 = ["mldsa"]
hash_mldsa = ["mldsa"] # Pre-hash ML-DSA requires the pure variant.

# ML-KEM Parameter Sets
mlkem_512 = ["mlkem"]
mlkem_768 = ["mlkem"]
mlkem_1024 = ["mlkem"]

# Key Derivation Functions (tpm-rs extension: `TPM_ALG_HKDF` is accepted only
# with this feature; MGF1, KDF1_SP800_56A, KDF2 and KDF1_SP800_108 are always
# enabled)
hkdf = []

# Profile settings that differ between TPM implementations (tpm-rs extensions,
# all disabled by default; enabled e.g. to match a C reference TPM in
# differential testing):
# `MAX_CAP_BUFFER` (`limits::MAX_CAP_BUFFER`) is 3072 instead of 1024.
max-cap-buffer-3072 = []
# `MAX_NV_INDEX_SIZE` (`TPM2_MAX_NV_INDEX_SIZE`, the bound of
# `TPMS_NV_PUBLIC.dataSize`) is 8500 instead of 2048.
max-nv-index-size-8500 = []
# `TPMA_OBJECT` bit 3 is `fixedFirmware` (a draft attribute, not evaluated)
# instead of reserved (`TPM_RC_RESERVED_BITS`).
tpma-object-fixed-firmware = []

[dependencies]
bitflags = { workspace = true }
