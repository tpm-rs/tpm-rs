[package]
name = "tpm2"
description = "Core types and traits for communicating with a TPM 2.0"

# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Implement conversions/traits which require std
std = []

# We enable all algorithms by default.
default = [
    # Hash Algorithms
    "sha1", "sha256", "sha384", "sha512", "sm3_256", "sha3_256", "sha3_384", "sha3_512",
    # Symmetric Encryption Algorithms
    "aes128", "aes192", "aes256", "sm4_128", "camellia128", "camellia192", "camellia256",
    # Symmetric Encryption Modes
    "ctr", "ofb", "cbc", "ecb",
    # Base Algorithm Families
    "cmac", "rsa", "ecc", "mldsa", "mlkem",
    # RSA Key Sizes
    "rsa1024", "rsa2048", "rsa3072", "rsa4096",
    # RSA Schemes
    "rsassa", "rsapss", "rsaes",
    # ECC Curves
    "nist_p192", "nist_p224", "nist_p256", "nist_p384", "nist_p521", "bn_p256", "bn_p638",
    "sm2_p256", "bp_p256_r1", "bp_p384_r1", "bp_p512_r1", "curve25519", "curve448",
    # ECC Schemes
    "ecdsa", "ecdaa", "ecschnorr", "eddsa", "hash_eddsa", "sm2", "ecmqv",
    # ML-DSA Parameter Sets and Schemes
    "mldsa_44", "mldsa_65", "mldsa_87", "hash_mldsa",
    # ML-KEM Parameter Sets
    "mlkem_512", "mlkem_768", "mlkem_1024",
]

# Hash Algorithms
sha1 = []
sha256 = []
sha384 = []
sha512 = []
sm3_256 = []
sha3_256 = []
sha3_384 = []
sha3_512 = []

# Symmetric Encryption Algorithms
aes128 = []
aes192 = []
aes256 = []
sm4_128 = []
camellia128 = []
camellia192 = []
camellia256 = []

# Symmetric Encryption Modes
#
# CFB is always enabled, as the parameter encryption mode.
ctr = []
ofb = []
cbc = []
ecb = []

# Base Algorithm Families
cmac = []
rsa = [] # Enables OAEP, requires at least one RSA Key Size
ecc = [] # Enables ECDH, requires at least one ECC Curve
mldsa = [] # Requires at least one ML-DSA Parameter Set
mlkem = [] # Requires at least one ML-KEM Parameter Set

# RSA Key Sizes
rsa1024 = ["rsa"]
rsa2048 = ["rsa"]
rsa3072 = ["rsa"]
rsa4096 = ["rsa"]

# RSA Schemes
#
# OAEP is always enabled with `rsa`, as the RSA secret sharing scheme.
rsassa = ["rsa"]
rsapss = ["rsa"]
rsaes = ["rsa"]

# ECC Curves
nist_p192 = ["ecc"]
nist_p224 = ["ecc"]
nist_p256 = ["ecc"]
nist_p384 = ["ecc"]
nist_p521 = ["ecc"]
bn_p256 = ["ecc"]
bn_p638 = ["ecc"]
sm2_p256 = ["ecc"]
bp_p256_r1 = ["ecc"]
bp_p384_r1 = ["ecc"]
bp_p512_r1 = ["ecc"]
curve25519 = ["ecc"]
curve448 = ["ecc"]

# ECC Schemes
#
# ECDH is always enabled with `ecc`, as the ECC secret sharing scheme.
ecdsa = ["ecc"]
ecdaa = ["ecc"]
ecschnorr = ["ecc"]
eddsa = ["ecc"] # Requires Curve25519 or Curve448
hash_eddsa = ["eddsa"] # Pre-hash EdDSA requires the pure variant.
sm2 = ["ecc"] # SM2 signing and key exchange
ecmqv = ["ecc"]

# ML-DSA Parameter Sets and Schemes
mldsa_44 = ["mldsa"]
mldsa_65 = ["mldsa"]
mldsa_87 = ["mldsa"]
hash_mldsa = ["mldsa"] # Pre-hash ML-DSA requires the pure variant.

# ML-KEM Parameter Sets
mlkem_512 = ["mlkem"]
mlkem_768 = ["mlkem"]
mlkem_1024 = ["mlkem"]

[dependencies]
bitflags = { workspace = true }
