[package]
name = "tpm2-simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tpm2-impl = { workspace = true }
tpm2 = { workspace = true }
tpm2-platform-linux = { path = "../tpm2-platforms/linux", default-features = false }
anyhow = { version = "1.0.102", features = ["backtrace"] }

[features]
default = ["rustcrypto"]
rustcrypto = ["tpm2-platform-linux/rustcrypto"]
libcrux = ["tpm2-platform-linux/libcrux"]
boringssl = ["tpm2-platform-linux/boringssl"]
