[package]
name = "tpm2-simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tpm2-engine = { workspace = true, features = ["std"] }
tpm2 = { workspace = true }
tpm2-platform-linux = { path = "../tpm2-platforms/linux", default-features = false }
anyhow = { version = "1.0.102", features = ["backtrace"] }

[features]
default = ["bssl", "sha512", "vendor-permanent-auth"]
# SHA-512 (the `sha512` feature of `tpm2`). A TPM without SHA-512 (like a C
# reference built without `ALG_SHA512`) is built with every crate without it.
sha512 = ["tpm2/sha512", "tpm2-engine/sha512", "tpm2-platform-linux/sha512"]
# The vendor-specific permanent authorization handle `TPM_RH_AUTH_00` (`tpm2-engine`'s
# `vendor-permanent-auth`, on by default).
vendor-permanent-auth = ["tpm2-engine/vendor-permanent-auth"]
rust = ["tpm2-platform-linux/rust"]
crux = ["tpm2-platform-linux/crux"]
bssl = ["tpm2-platform-linux/bssl"]
# The Nuvoton `NTC2_*` vendor commands of the Linux platform.
ntc2-vendor-commands = ["tpm2-platform-linux/ntc2-vendor-commands"]
# Adds `create_reference_simulator!(pid, realtime_ms)` and
# `Simulator::advance_clock`: a simulator that reproduces the platform entropy,
# DRBG and virtual clock of one C reference TPM process (used by the E2E and
# differential tests in `testing`). Purely additive: `create_simulator!()` is
# unchanged.
reference-rng = ["tpm2-platform-linux/reference-rng"]

