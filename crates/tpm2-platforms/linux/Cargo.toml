[package]
name = "tpm2-platform-linux"
# Inherit from Workspace Settings
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
tpm2-impl = { workspace = true }
tpm2-crypto-rust = { workspace = true, optional = true }
tpm2-crypto-crux = { workspace = true, optional = true }
tpm2-crypto-bssl = { workspace = true, optional = true }

[features]
default = ["bssl", "sha512"]
# SHA-512 (the `sha512` feature of `tpm2`). A TPM without SHA-512 (like a C
# reference built without `ALG_SHA512`) is built with every crate without it.
sha512 = ["tpm2/sha512", "tpm2-impl/sha512", "tpm2-crypto-rust?/sha512", "tpm2-crypto-crux?/sha512", "tpm2-crypto-bssl?/sha512"]
rust = ["dep:tpm2-crypto-rust"]
crux = ["dep:tpm2-crypto-crux"]
bssl = ["dep:tpm2-crypto-bssl"]
# Reproduce the simulator-platform entropy source and clock of the C reference
# TPMs (`LinuxRng::reference`, `LinuxTimer::new_virtual`, `VirtualClock`) and
# enable `tpm2-impl`'s linked C code of their DRBG, for differential testing.
reference-rng = ["tpm2-impl/reference-rng"]

