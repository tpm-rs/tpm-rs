[package]
name = "tpm2-crypto-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
sha2 = "0.10.9"
sha1 = "0.10.6"
hmac = "0.12.1"
cmac = "0.7.2"
aes = "0.8.4"
cfb-mode = "0.8.2"
rsa = { version = "0.9.10", features = ["sha2", "sha1", "getrandom"] }
p256 = { version = "0.13.2", features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
p521 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
rand = "0.9.4"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
hex-literal = { workspace = true }
