[package]
name = "tpm2-crypto-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
# Default features are disabled so that this crate stays usable on `no_std`
# targets (e.g. bare-metal firmware such as COCONUT-SVSM).
sha2 = { version = "0.10.9", default-features = false }
sha1 = { version = "0.10.6", default-features = false }
hmac = { version = "0.12.1", default-features = false }
cmac = { version = "0.7.2", default-features = false }
aes = { version = "0.8.4", default-features = false }
cfb-mode = { version = "0.8.2", default-features = false }
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "sha1", "getrandom", "u64_digit"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "getrandom"] }
rand = { version = "0.9.4", default-features = false, features = ["os_rng"] }
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
hex-literal = { workspace = true }

[features]
default = ["sha512"]
# SHA-512 (the `sha512` feature of `tpm2`). A TPM without SHA-512 (like a C
# reference built without `ALG_SHA512`) is built with every crate without it.
sha512 = ["tpm2/sha512"]
