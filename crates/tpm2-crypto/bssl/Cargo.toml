[package]
name = "tpm2-crypto-bssl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = false

[dependencies]
tpm2 = { workspace = true }
bssl-crypto = { git = "https://boringssl.googlesource.com/boringssl" }
bssl-sys = { git = "https://boringssl.googlesource.com/boringssl" }
rand_chacha = "0.3.1"
rand_core = "0.6.4"
hex-literal = { workspace = true }

[features]
default = ["sha512"]
# SHA-512 (the `sha512` feature of `tpm2`). A TPM without SHA-512 (like a C
# reference built without `ALG_SHA512`) is built with every crate without it.
sha512 = ["tpm2/sha512"]
