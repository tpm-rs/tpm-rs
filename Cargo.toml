[workspace]
resolver = "3"

members = [
    "crates/tpm2",
    "crates/tpm2-client",
    "crates/tpm2-impl",
    "crates/tpm2-platforms/linux",
    "crates/tpm2-simulator",
    "crates/tpm2-crypto/rust",
    "crates/tpm2-crypto/crux",
    "crates/tpm2-crypto/bssl",
    "crates/tpm2-crypto/tests",
    "testing",
]
exclude = [
    "crates/tpm2-crypto/bssl/bssl-sys",
    # The differential fuzzer: its own workspace, built with `cargo fuzz`
    # (nightly, sanitizers), so the workspace builds stay unaffected.
    "testing/fuzz",
]

# Package keys that should be used by all packages.
# We don't set: authors (deprecated), license-file, exclude, include, or publish
# Defaults are fine for: documentation (crates.io) and readme (README.md)
# Packages should set their own: name and description
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
homepage = "https://github.com/tpm-rs"
repository = "https://github.com/tpm-rs/tpm-rs"
license = "Apache-2.0"
keywords = ["tpm", "tss", "tpm2"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
# Third party dependencies
bitflags = "2.4.2"
hex-literal = { version = "0.4.1" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3.25.0"
trybuild = { version = "1.0.89", features = ["diff"] }
zerocopy = { version = "0.8.33", features = ["derive"] }

# Common workspace crates
# The algorithms of the TPM are the default features of `tpm2` (see
# crates/tpm2/Cargo.toml), except SHA-512: it is optional, enabled by the
# default `sha512` feature of every crate that uses `tpm2` (which forwards it to
# `tpm2/sha512`), so that a build without it (every dependency with
# `default-features = false`) is a TPM without SHA-512.
tpm2 = { path = "crates/tpm2", default-features = false, features = [
    "sha1", "sha256", "sha384",
    "aes128", "aes256",
    "ctr", "ofb", "cbc", "ecb",
    "ecc_curve_nist_p224",
    "ecc_curve_nist_p256",
    "ecc_curve_nist_p384",
    "ecc_curve_nist_p521",
    "ecc_curve_bn_p256",
    "rsa1024",
    "rsa2048",
    "rsassa",
    "rsapss",
    "rsaes",
    "oaep",
    "ecdsa",
    "ecdh",
    "ecdaa",
] }
tpm2-client = { path = "crates/tpm2-client" }
# Without their default features (`sha512`), which each dependent forwards from its own `sha512`.
tpm2-impl = { path = "crates/tpm2-impl", default-features = false }
tpm2-crypto-rust = { path = "crates/tpm2-crypto/rust", default-features = false }
tpm2-crypto-crux = { path = "crates/tpm2-crypto/crux", default-features = false }
tpm2-crypto-bssl = { path = "crates/tpm2-crypto/bssl", default-features = false }
tpm2-crypto-tests = { path = "crates/tpm2-crypto/tests" }

[profile.release]
lto = true # default is lto = false
codegen-units = 1 # default is codegen-units = 16
strip = true # default is strip = "none"

[patch."https://boringssl.googlesource.com/boringssl"]
bssl-sys = { path = "crates/tpm2-crypto/bssl/bssl-sys" }

