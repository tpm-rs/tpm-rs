[workspace]
resolver = "3"

members = [
    "crates/tpm2",
    "crates/tpm2-client",
    "crates/tpm2-impl",
    "crates/tpm2-rustcrypto",
]

# Package keys that should be used by all packages.
# We don't set: authors (deprecated), license-file, exclude, include, or publish
# Defaults are fine for: documentation (crates.io) and readme (README.md)
# Packages should set their own: name and description
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
homepage = "https://github.com/tpm-rs"
repository = "https://github.com/tpm-rs/tpm-rs"
license = "Apache-2.0"
keywords = ["tpm", "tss", "tpm2"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
# Third party dependencies
bitflags = "2.4.2"
hex-literal = { version = "0.4.1" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3.25.0"
trybuild = { version = "1.0.89", features = ["diff"] }
zerocopy = { version = "0.8.33", features = ["derive"] }

# RustCrypto dependencies (for tpm2-rustcrypto)
aes = "0.8"
camellia = "0.1"
cipher = "0.4"
cmac = "0.7"
ecdsa = { version = "0.16", default-features = false }
elliptic-curve = { version = "0.13", default-features = false }
getrandom = "0.4"
hmac = "0.12"
ml-dsa = { version = "0.1", default-features = false }
ml-kem = { version = "0.3", default-features = false }
p256 = { version = "0.13", default-features = false }
p384 = { version = "0.13", default-features = false }
p521 = { version = "0.13", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rsa = { version = "0.9.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
sm2 = { version = "0.13", default-features = false }
sm3 = { version = "0.4", default-features = false }
sm4 = "0.5"
subtle = { version = "2.6", default-features = false }

# Common workspace crates
tpm2 = { path = "crates/tpm2" }
tpm2-client = { path = "crates/tpm2-client" }
tpm2-impl = { path = "crates/tpm2-impl" }
tpm2-rustcrypto = { path = "crates/tpm2-rustcrypto" }

[profile.release]
lto = true # default is lto = false
codegen-units = 1 # default is codegen-units = 16
strip = true # default is strip = "none"
