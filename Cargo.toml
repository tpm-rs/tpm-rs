[workspace]
resolver = "3"

members = [
    "crates/tpm2",
    "crates/tpm2-boringssl",
    "crates/tpm2-client",
    "crates/tpm2-impl",
    "crates/tpm2-openssl",
    "crates/tpm2-rustcrypto",
    "crates/xtask",
    "testing/crypto",
]
# tpm2-boringssl requires BoringSSL to be built first (see its README), so it is
# not built by default.
default-members = [
    "crates/tpm2",
    "crates/tpm2-client",
    "crates/tpm2-impl",
    "crates/tpm2-openssl",
    "crates/tpm2-rustcrypto",
    "crates/xtask",
    "testing/crypto",
]
exclude = ["testing/size-harness"]

# Package keys that should be used by all packages.
# We don't set: authors (deprecated), license-file, exclude, include, or publish
# Defaults are fine for: documentation (crates.io)
# Packages should set their own: name and description
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
readme = "README.md"
homepage = "https://github.com/tpm-rs"
repository = "https://github.com/tpm-rs/tpm-rs"
license = "Apache-2.0"
keywords = ["tpm", "tss", "tpm2"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
# Common third-party dependencies used across crates.
# Dependencies only used by a single crate are in that crate's Cargo.toml.
bitflags = "2.13"

# Workspace crates used by other workspace crates.
tpm2 = { path = "crates/tpm2", version = "0.2.0" }

[profile.release]
lto = true        # default is lto = false
codegen-units = 1 # default is codegen-units = 16
strip = true      # default is strip = "none"
