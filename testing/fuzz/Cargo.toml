# Differential fuzzing of tpm-rs against the C reference TPMs (`cargo fuzz`).
#
# One fuzz input is a multi-round conversation with a fresh, started TPM;
# every command goes to tpm-rs and to the C reference of the selected target
# (`testing` with that `target-*` feature, which also gives tpm-rs the profile
# of that reference), and any undocumented response difference is a finding.
# Build and run from the repository root (default target: `target-mstpm20`):
#
#   cargo fuzz build --fuzz-dir testing/fuzz
#   cargo fuzz run --fuzz-dir testing/fuzz diff_conversation
#   cargo fuzz build --fuzz-dir testing/fuzz --no-default-features \
#       --features target-ibmswtpm2
#
# The crate is its own workspace (and excluded from the root workspace), so
# the root `cargo test`/`cargo clippy` are unaffected by its nightly-only,
# sanitizer-instrumented build.

[package]
name = "tpm2-fuzz"
description = "Differential fuzzing of tpm-rs against the C reference TPMs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.4.2", features = ["derive"] }
testing = { path = ".." }
# The features are unified with those `testing` enables.
tpm2 = { path = "../../crates/tpm2" }

[lib]
path = "src/lib.rs"

[features]
default = ["target-mstpm20"]
# The C reference TPM the conversations are compared with (exactly one; see
# `testing`'s features of the same names).
target-mstpm20 = ["testing/target-mstpm20"]
target-mstpm20-v185 = ["testing/target-mstpm20-v185"]
target-ibmswtpm2 = ["testing/target-ibmswtpm2"]
# Mirror to the C reference linked into the fuzzer process (`testing`'s
# `fuzz-inproc`) instead of reference processes: no pipe round trips and no
# REFERENCE_BIN needed (`cargo fuzz build --features inproc`).
inproc = ["testing/fuzz-inproc"]

[[bin]]
name = "diff_conversation"
path = "fuzz_targets/diff_conversation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
# Symbols for readable crash stack traces.
debug = 1

# Like the root workspace: the BoringSSL backend builds the in-tree bssl-sys.
[patch."https://boringssl.googlesource.com/boringssl"]
bssl-sys = { path = "../../crates/tpm2-crypto/bssl/bssl-sys" }
