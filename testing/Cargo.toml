[package]
name = "testing"
description = "E2E tests of the TPM stack, optionally run differentially against C reference TPMs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
# Dependent build scripts find the C reference archives (`differential`) as
# `DEP_TPM_REFERENCES_<NAME>_ARCHIVE`.
links = "tpm-references"
autobins = false

[dependencies]
# Tests run against a simulator that reproduces the randomness and virtual
# clock of a C reference TPM process (`reference-rng`), so that the C reference
# TPMs can be kept in lockstep, on the BoringSSL backend.
tpm2-simulator = { path = "../crates/tpm2-simulator", default-features = false, features = [
    "bssl",
    "reference-rng",
] }
tpm2-platform-linux = { path = "../crates/tpm2-platforms/linux", default-features = false, features = [
    "bssl",
    "reference-rng",
] }
tpm2 = { workspace = true }
# For the profile features of the `target-*` features.
tpm2-impl = { workspace = true }
rsa = { version = "0.9.10", features = ["sha2", "sha1", "getrandom"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
rand = "0.8.5"
p256 = { version = "0.13.2", features = ["ecdh", "arithmetic"] }
aes = "0.8.4"
cfb-mode = "0.8.2"
hmac = "0.12.1"

# The E2E tests currently support only the BoringSSL backend.

[features]
default = ["sha512"]
# SHA-512 (the `sha512` feature of `tpm2`). A TPM without SHA-512 (like a C
# reference built without `ALG_SHA512`) is built with every crate without it.
sha512 = ["tpm2/sha512", "tpm2-impl/sha512", "tpm2-simulator/sha512", "tpm2-platform-linux/sha512"]
# Differential testing: compares tpm-rs with one C reference TPM, the target,
# selected by exactly one `target-*` feature (enable that, not `differential`).
# build.rs clones, patches and builds the target into the `reference` binary,
# and every test runs against tpm-rs and the reference (one reference process
# per `Tpm`) in lockstep, comparing every response (see `src/differential/`).
#
# Each target also gives tpm-rs the profile of its reference with the profile
# features of `tpm2` and `tpm2-impl`, so that the reference needs fewer
# profile patches (`testing/patches/<target>/`). The features unify with the
# rest of the build, so every test of a target run sees that profile.
differential = []

# The public TCG reference implementation
# (https://github.com/TrustedComputingGroup/TPM), `testing/patches/mstpm20/`.
target-mstpm20 = [
    "differential",
    "tpm2/tpma-object-fixed-firmware",
    "tpm2-impl/max-context-size-2168",
]

# The TCG reference implementation version 185 (the TCG-internal
# https://github.com/TrustedComputingGroup/TPM-Internal, `185-feature` branch),
# `testing/patches/mstpm20-185-feature/`.
target-mstpm20-v185 = [
    "differential",
    "tpm2/tpma-object-fixed-firmware",
    "tpm2/max-cap-buffer-3072",
    "tpm2-impl/max-command-size-8192",
    "tpm2-impl/max-context-size-4344",
    "tpm2/max-nv-index-size-8500",
    "tpm2-impl/min-evict-objects-9",
    "tpm2-impl/nv-memory-size-128k",
    "tpm2-impl/ecc-parameters-null-kdf",
]

# The IBM software TPM (https://github.com/kgoldman/ibmswtpm2),
# `testing/patches/ibmswtpm2/`.
target-ibmswtpm2 = [
    "differential",
    "tpm2-impl/max-context-size-2680",
    "tpm2-impl/min-evict-objects-7",
    "tpm2-impl/nv-memory-size-32k",
]

# With a target: `differential::inproc::InProcReferences`, the C reference TPM
# in the calling process (no reference process or pipes), for fast
# single-threaded users such as the fuzz targets. The C reference keeps its
# state in globals, so a process hosts at most one at a time.
fuzz-inproc = ["differential"]

# The C reference TPM server launched by every `Tpm` of a differential build.
# It hosts the target through `differential::inproc` (the library links its C
# archive, see build.rs); it has no unit tests of its own.
[[bin]]
name = "reference"
path = "src/bin/reference.rs"
required-features = ["differential"]
test = false

# Go parity tests (`tests/go/`), one file per Go test file.
[[test]]
name = "go"
path = "tests/go/mod.rs"

# Topic-focused E2E tests (`tests/e2e/`), one file per command or feature area.
[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
