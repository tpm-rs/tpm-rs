[package]
name = "testing-crypto"
description = "Shared test vectors and tests for tpm2 crypto backends"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
hex-literal = "1"
aes = "0.9"
tpm2-openssl = { path = "../../crates/tpm2-openssl", optional = true }
tpm2-rustcrypto = { path = "../../crates/tpm2-rustcrypto", features = ["rsa"], optional = true }

[features]
default = ["rustcrypto", "openssl"]
openssl = ["dep:tpm2-openssl"]
rustcrypto = ["dep:tpm2-rustcrypto"]

[[test]]
name = "rustcrypto"
required-features = ["rustcrypto"]

[[test]]
name = "openssl_basic"
required-features = ["openssl"]

[[test]]
name = "openssl"
required-features = ["openssl", "rustcrypto"]

[[test]]
name = "openssl_schnorr_sm2"
required-features = ["openssl"]
