[package]
name = "testing-crypto"
description = "Shared test vectors and tests for tpm2 crypto backends"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpm2 = { workspace = true }
hex-literal = "1"
tpm2-boringssl = { path = "../../crates/tpm2-boringssl", optional = true }
tpm2-rustcrypto = { path = "../../crates/tpm2-rustcrypto", features = ["rsa"], optional = true }

[dev-dependencies]
aes = "0.9"

[features]
default = ["rustcrypto"]
# Requires a BoringSSL build; see crates/tpm2-boringssl/README.md.
boringssl = ["dep:tpm2-boringssl"]
rustcrypto = ["dep:tpm2-rustcrypto"]

[[test]]
name = "rustcrypto"
required-features = ["rustcrypto"]

[[test]]
name = "boringssl"
required-features = ["boringssl"]

[[test]]
name = "boringssl_rustcrypto"
required-features = ["boringssl", "rustcrypto"]
