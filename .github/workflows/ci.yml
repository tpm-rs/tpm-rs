name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo test

  features:
    name: Feature Subsets (tpm2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is added to a minimal base of hash and symmetric features.
        features:
          - ""
          - "cmac"
          - "rsa2048"
          - "rsa2048,rsassa,rsapss,rsaes"
          - "nist_p256"
          - "nist_p256,ecdsa"
          - "sm2_p256,sm2,ecdaa,ecschnorr,ecmqv"
          - "curve25519,eddsa"
          - "curve448,hash_eddsa"
          - "mldsa_44,hash_mldsa"
          - "mlkem_768"
    env:
      FEATURES: sha256,sha384,aes128,${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo clippy -p tpm2 --all-targets --no-default-features --features "$FEATURES" -- -D warnings
      - run: cargo test -p tpm2 --no-default-features --features "$FEATURES"

  integration_test:
    name: Client Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build container and run simulator tests in it
        run: cd crates/tpm2-client && docker compose build && docker compose run simulator_tests

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path testing/size-harness/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      # tpm2-boringssl (and the `boringssl` tests) are checked by the BoringSSL job.
      - run: cargo clippy --workspace --exclude tpm2-boringssl --exclude testing-crypto --all-targets --all-features -- -D warnings
      - run: cargo clippy -p testing-crypto --all-targets -- -D warnings

  boringssl:
    name: BoringSSL Backend
    runs-on: ubuntu-latest
    # BoringSSL builds with `-Werror`, and GCC 15 reports false positives
    # (`-Wstringop-overflow`) in it.
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake libclang-dev
      - run: rustc --version
      # A fixed version, so `src/docsrs_bindings.rs` is reproducible.
      - run: cargo install --locked bindgen-cli@0.72.1
      - run: crates/tpm2-boringssl/boringssl.py build
      # Also builds the docs as docs.rs does (without BoringSSL).
      - name: Check src/docsrs_bindings.rs is up to date
        run: crates/tpm2-boringssl/boringssl.py docs-bindings && git diff --exit-code
      # Not with `openssl`: `bssl-sys` puts BoringSSL's `libcrypto.a` on the
      # link search path of every binary in the package.
      - run: cargo clippy -p tpm2-boringssl -p testing-crypto --all-targets --no-default-features --features testing-crypto/boringssl,testing-crypto/rustcrypto -- -D warnings
      - run: cargo test -p testing-crypto --no-default-features --features boringssl,rustcrypto

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings --cfg docsrs"
    steps:
      - uses: actions/checkout@v4
      - run: rustc +nightly --version
      - run: cargo +nightly doc

  miri:
    name: Miri UB Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add miri --toolchain nightly
      - run: rustc +nightly --version
      - run: cargo +nightly miri test --workspace --exclude tpm2-boringssl --exclude tpm2-openssl --exclude testing-crypto

  size:
    name: Binary Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: size-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bare-metal targets
        run: rustup target add riscv32imac-unknown-none-elf thumbv7em-none-eabihf x86_64-unknown-none
      - run: rustc --version
      - name: Measure binary size deltas
        run: cargo xtask size --base HEAD^1 --head HEAD
