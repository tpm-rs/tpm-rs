name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo test

  features:
    name: Feature Subsets (tpm2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is added to a minimal base of hash and symmetric features.
        features:
          - ""
          - "cmac"
          - "rsa2048"
          - "rsa2048,rsassa,rsapss,rsaes"
          - "nist_p256"
          - "nist_p256,ecdsa"
          - "sm2_p256,sm2,ecdaa,ecschnorr,ecmqv"
          - "curve25519,eddsa"
          - "curve448,hash_eddsa"
          - "mldsa_44,hash_mldsa"
          - "mlkem_768"
    env:
      FEATURES: sha256,sha384,aes128,${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo clippy -p tpm2 --all-targets --no-default-features --features "$FEATURES" -- -D warnings
      - run: cargo test -p tpm2 --no-default-features --features "$FEATURES"

  integration_test:
    name: Client Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build container and run simulator tests in it
        run: cd crates/tpm2-client && docker compose build && docker compose run simulator_tests

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo doc

  miri:
    name: Miri UB Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add miri --toolchain nightly
      - run: rustc +nightly --version
      - run: cargo +nightly miri test
